  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--cream); font-family: Georgia, serif; }
  .marquee { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.06em; }
  .serif { font-family: 'Libre Caslon Text', serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  .sprockets { display: flex; justify-content: space-between; padding: 6px 12px; background: var(--velvet); }
  .sprockets span { width: 10px; height: 10px; border-radius: 50%; background: var(--bg); margin: 6px 0; }
  header { border-bottom: 1px solid var(--line); }
  .header-inner { padding: 28px 0; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .eyebrow { display: flex; align-items: center; gap: 8px; color: var(--gold); margin-bottom: 4px; }
  h1.title { font-size: 52px; margin: 0; }
  .total-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); text-align: right; }
  .total-value { font-size: 40px; color: var(--gold); text-align: right; }
  main { padding: 24px 0 60px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 3px; margin-bottom: 24px; overflow: hidden; }
  .panel-header { padding: 12px 20px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold); display: flex; align-items: center; justify-content: space-between; width: 100%; background: none; border: none; cursor: pointer; text-align: left; }
  .panel-body { padding: 0 20px 20px; border-top: 1px dashed var(--line); }
  .panel-body p { color: var(--muted); font-family: 'Libre Caslon Text', serif; font-size: 14px; padding-top: 12px; }
  .upload-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border: 1px dashed var(--goldDim); border-radius: 3px; color: var(--gold); font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 32px; }
  @media (min-width: 900px) { .grid { grid-template-columns: 2fr 3fr; } }
  .card-title { font-size: 24px; color: var(--gold); margin: 0; padding: 16px 20px; border-bottom: 1px dashed var(--line); }
  .form-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .toggle-row { display: flex; gap: 8px; }
  .toggle-btn { flex: 1; padding: 10px; border-radius: 3px; font-family: 'Libre Caslon Text', serif; font-size: 14px; cursor: pointer; background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .toggle-btn.active { background: var(--gold); color: var(--bg); border-color: var(--gold); }
  .toggle-btn.small.active { background: var(--goldDim); color: var(--cream); border-color: var(--goldDim); }
  label.field-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: block; margin-bottom: 4px; }
  input[type=text], input[type=number], input[type=date] {
    width: 100%; padding: 9px 12px; border-radius: 3px; background: var(--cardAlt); color: var(--cream);
    border: 1px solid var(--line); font-family: 'Libre Caslon Text', serif; font-size: 15px;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .title-row { display: flex; gap: 8px; }
  .find-btn { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 9px 12px; border-radius: 3px; background: transparent; color: var(--gold); border: 1px solid var(--goldDim); font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; cursor: pointer; }
  .hint { font-family: 'IBM Plex Mono', monospace; font-size: 11px; margin-top: 4px; }
  .hint.good { color: var(--gold); }
  .hint.muted { color: var(--muted); }
  .hint.bad { color: #D9756B; }
  .computed-box { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 3px; background: var(--cardAlt); border: 1px solid var(--goldDim); }
  .add-btn { width: 100%; padding: 11px; border-radius: 3px; background: var(--velvet); color: var(--cream); border: none; font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 0.04em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .stats-panel { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .stat-label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; }
  .stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 26px; margin-top: 2px; }
  .stat-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); }
  .section-title { display: flex; align-items: center; gap: 8px; color: var(--gold); margin-bottom: 12px; }
  .section-title h3 { font-family: 'Bebas Neue', sans-serif; font-size: 20px; margin: 0; letter-spacing: 0.04em; }
  .empty-box { padding: 24px; text-align: center; background: var(--card); border: 1px dashed var(--line); border-radius: 3px; color: var(--muted); font-family: 'Libre Caslon Text', serif; font-size: 14px; }
  ul.entry-list { list-style: none; margin: 0; padding: 0; }
  ul.entry-list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px dashed var(--line); }
  ul.entry-list li:last-child { border-bottom: none; }
  .entry-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .entry-icon { width: 34px; height: 34px; border-radius: 50%; background: var(--cardAlt); color: var(--gold); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; }
  .entry-title { font-family: 'Libre Caslon Text', serif; font-size: 15px; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); }
  .entry-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .entry-duration { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--gold); }
  .delete-btn { background: none; border: none; color: var(--muted); cursor: pointer; opacity: 0.6; font-size: 15px; }
  .delete-btn:hover { opacity: 1; }

  function normalizeKey(str) {
    return str
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function containsAsWords(haystack, needle) {
    if (!needle) return false;
    var escaped = needle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return new RegExp("(^|\\s)" + escaped + "($|\\s)").test(haystack);
  }

  function findInDatabase(title, db) {
    var key = normalizeKey(title);
    if (db[key]) return db[key];
    var bestMatch = null, bestLength = 0;
    for (var dbKey in db) {
      if (!db.hasOwnProperty(dbKey)) continue;
      var shorter = Math.min(key.length, dbKey.length);
      var longer = Math.max(key.length, dbKey.length);
      var coversEnough = shorter / longer >= 0.6;
      var wordMatch = containsAsWords(key, dbKey) || containsAsWords(dbKey, key);
      if (wordMatch && coversEnough && dbKey.length > bestLength) {
        bestMatch = db[dbKey];
        bestLength = dbKey.length;
      }
    }
    return bestMatch;
  }

  // ===================== UTILITAIRES =====================
  function formatDuration(totalMinutes) {
    var d = Math.floor(totalMinutes / 1440);
    var h = Math.floor((totalMinutes % 1440) / 60);
    var m = totalMinutes % 60;
    if (d > 0) {
      var parts = [d + " j"];
      if (h > 0) parts.push(h + " h");
      if (m > 0) parts.push(m + " min");
      return parts.join(" ");
    }
    if (h === 0) return m + " min";
    if (m === 0) return h + " h";
    return h + " h " + m + " min";
  }

  function todayISO() {
    return new Date().toISOString().slice(0, 10);
  }

  function formatDateFR(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function uid() {
    return Date.now() + "-" + Math.random().toString(36).slice(2, 8);
  }

      return raw ? JSON.parse(raw) : [];

  function saveEntries(entries) {

  // ===================== PARSEUR CSV (mini, sans dépendance) =====================
  function parseCSV(text) {
    var lines = text.split(/\r?\n/).filter(function (l) { return l.length > 0; });
    if (lines.length === 0) return [];
    var headers = parseCSVLine(lines[0]);
    var rows = [];
    for (var i = 1; i < lines.length; i++) {
      var vals = parseCSVLine(lines[i]);
      var obj = {};
      for (var j = 0; j < headers.length; j++) obj[headers[j]] = vals[j] !== undefined ? vals[j] : "";
      rows.push(obj);
    }
    return rows;
  }
  function parseCSVLine(line) {
    var result = [], cur = "", inQuotes = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (inQuotes) {
        if (c === '"') {
          if (line[i + 1] === '"') { cur += '"'; i++; } else { inQuotes = false; }
        } else { cur += c; }
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ",") { result.push(cur); cur = ""; }
        else cur += c;
      }
    }
    result.push(cur);
    return result;
  }

  // ===================== IMPORT IMDB =====================
  var MOVIE_LIKE_TYPES = { movie: 1, tvMovie: 1, video: 1, short: 1, tvSpecial: 1, documentary: 1 };
  var SERIES_LIKE_TYPES = { tvSeries: 1, tvMiniSeries: 1 };

  function parseImdbRuntime(raw) {
    var n = parseInt(String(raw).replace(/[^\d]/g, ""), 10);
    return isFinite(n) && n > 0 ? n : null;
  }

  function processImdbRows(rows, existingEntries) {
    var existingIds = {};
    existingEntries.forEach(function (e) { if (e.imdbId) existingIds[e.imdbId] = true; });
    var newEntries = [], unmatched = [], skippedDuplicate = 0;

    rows.forEach(function (row) {
      var imdbId = row["Const"] || row["const"];
      var rawTitle = (row["Title"] || row["title"] || "").trim();
      var titleType = row["Title Type"] || row["titleType"] || "movie";
      var csvRuntime = parseImdbRuntime(row["Runtime (mins)"]);
      var dateRated = row["Date Rated"] || row["Release Date"] || null;
      var date = dateRated && /^\d{4}-\d{2}-\d{2}/.test(dateRated) ? dateRated.slice(0, 10) : todayISO();

      if (!rawTitle) return;
      if (imdbId && existingIds[imdbId]) { skippedDuplicate++; return; }

      var isSeries = !!SERIES_LIKE_TYPES[titleType];
      var isMovieLike = !!MOVIE_LIKE_TYPES[titleType] || (!isSeries && titleType !== "tvEpisode");
      if (!isSeries && !isMovieLike) return;

      if (isSeries) {
        var dbMatch = findInDatabase(rawTitle, KNOWN_SERIES);
        var minutes, episodes, episodeMinutes, note;
        if (dbMatch && dbMatch.totalMinutes) {
          minutes = dbMatch.totalMinutes;
          note = "durée totale exacte (base locale)";
        } else if (dbMatch) {
          minutes = dbMatch.episodeMinutes * dbMatch.totalEpisodes;
          episodes = dbMatch.totalEpisodes;
          episodeMinutes = dbMatch.episodeMinutes;
          note = "estimée (moyenne épisode × nb épisodes)";
        } else if (csvRuntime) {
          minutes = csvRuntime;
          note = "1 épisode seulement (durée totale inconnue)";
          unmatched.push(rawTitle);
        } else {
          unmatched.push(rawTitle);
          return;
        }
        newEntries.push({
          id: uid(), title: dbMatch ? dbMatch.matchedTitle : rawTitle, type: "series",
          minutes: minutes, episodes: episodes || null, episodeMinutes: episodeMinutes || null,
          date: date, imdbId: imdbId || null, importNote: note
        });
      } else {
        var dbMatchM = findInDatabase(rawTitle, KNOWN_MOVIES);
        var minutesM = csvRuntime || (dbMatchM ? dbMatchM.runtimeMinutes : null);
        if (!minutesM) { unmatched.push(rawTitle); return; }
        newEntries.push({
          id: uid(), title: dbMatchM ? dbMatchM.matchedTitle : rawTitle, type: "movie",
          minutes: minutesM, episodes: null, episodeMinutes: null,
          date: date, imdbId: imdbId || null,
          importNote: csvRuntime ? "durée exacte (IMDb)" : "durée exacte (base locale)"
        });
      }
    });

    return { newEntries: newEntries, skippedDuplicate: skippedDuplicate, unmatched: unmatched };
  }

  function computedTotal() {
    if (state.type === "movie") return Number(state.movieMinutes) || 0;
    if (state.seriesMode === "episodes") return (Number(state.episodes) || 0) * (Number(state.episodeMinutes) || 0);
    return (Number(state.seriesTotalHours) || 0) * 60 + (Number(state.seriesTotalMinutes) || 0);
  }

  function resetForm() {
    state.title = ""; state.movieMinutes = ""; state.episodes = ""; state.episodeMinutes = "";
    state.seriesTotalHours = ""; state.seriesTotalMinutes = ""; state.date = todayISO();
    state.formError = ""; state.lookupStatus = "idle"; state.lookupInfo = null;
  }

  function handleLookup() {
    if (!state.title.trim()) { state.formError = "Tape d'abord un titre à rechercher."; render(); return; }
    var db = state.type === "movie" ? KNOWN_MOVIES : KNOWN_SERIES;
    var found = findInDatabase(state.title, db);
    if (!found) {
      state.lookupStatus = "error";
      state.formError = "Ce titre n'est pas dans la base locale. Renseigne la durée manuellement.";
      render(); return;
    }
    if (state.type === "movie") {
      state.movieMinutes = String(found.runtimeMinutes);
    } else if (state.seriesMode === "total" && found.totalMinutes) {
      state.seriesTotalHours = String(Math.floor(found.totalMinutes / 60));
      state.seriesTotalMinutes = String(found.totalMinutes % 60);
    } else if (state.seriesMode === "total" && !found.totalMinutes) {
      state.lookupStatus = "error";
      state.formError = "Le total exact de cette série n'est pas connu. Passe en mode épisodes ou saisis-le à la main.";
      render(); return;
    } else {
      state.seriesMode = "episodes";
      state.episodeMinutes = String(found.episodeMinutes);
    }
    state.lookupInfo = found;
    state.lookupStatus = "done";
    state.formError = "";
    render();
  }

  function handleAdd() {
    if (!state.title.trim()) { state.formError = "Donne un titre à ce que tu as regardé."; render(); return; }
    var total = computedTotal();
    if (total <= 0) {
      state.formError = state.type === "movie"
        ? "Indique la durée du film en minutes."
        : (state.seriesMode === "episodes" ? "Indique le nombre d'épisodes et la durée d'un épisode." : "Indique la durée totale de la série.");
      render(); return;
    }
    var entry = {
      id: uid(), title: state.title.trim(), type: state.type, minutes: total,
      episodes: state.type === "series" && state.seriesMode === "episodes" ? Number(state.episodes) : null,
      episodeMinutes: state.type === "series" && state.seriesMode === "episodes" ? Number(state.episodeMinutes) : null,
      date: state.date
    };
    state.entries = [entry].concat(state.entries);
    saveEntries(state.entries);
    resetForm();
    render();
  }

  function handleDelete(id) {
    state.entries = state.entries.filter(function (e) { return e.id !== id; });
    saveEntries(state.entries);
    render();
  }

  function handleImportFile(file) {
    state.importStatus = "loading";
    state.importSummary = null;
    render();
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var rows = parseCSV(reader.result);
        var result = processImdbRows(rows, state.entries);
        state.entries = result.newEntries.concat(state.entries);
        saveEntries(state.entries);
        state.importSummary = { added: result.newEntries.length, skippedDuplicate: result.skippedDuplicate, unmatched: result.unmatched };
        state.importStatus = "done";
      } catch (e) {
        console.error(e);
        state.importStatus = "error";
      }
      render();
    };
    reader.onerror = function () { state.importStatus = "error"; render(); };
    reader.readAsText(file);
  }

  // ===================== RENDU =====================

    var s = '<div class="sprockets">';

  function renderEntryList(items) {

        '<button class="delete-btn" data-delete="' + e.id + '">🗑️</button>' +

  }

    var total = computedTotal();

  function attachEvents() {

    if (toggleImport) toggleImport.onclick = function () { state.showImport = !state.showImport; render(); };

    var importInput = document.getElementById("importInput");
    if (importInput) importInput.onchange = function (e) {
      if (e.target.files && e.target.files[0]) handleImportFile(e.target.files[0]);
    };

    root.querySelectorAll("[data-type]").forEach(function (btn) {
      btn.onclick = function () { state.type = btn.getAttribute("data-type"); render(); };
    });
    root.querySelectorAll("[data-seriesmode]").forEach(function (btn) {
      btn.onclick = function () { state.seriesMode = btn.getAttribute("data-seriesmode"); render(); };
    });

    var titleInput = document.getElementById("titleInput");
    if (titleInput) {
      titleInput.oninput = function () { state.title = titleInput.value; state.lookupStatus = "idle"; state.lookupInfo = null; };
      titleInput.focus();
      titleInput.setSelectionRange(titleInput.value.length, titleInput.value.length);
    }
    var findBtn = document.getElementById("findBtn");
    if (findBtn) findBtn.onclick = handleLookup;

    var movieMinutesInput = document.getElementById("movieMinutesInput");
    if (movieMinutesInput) movieMinutesInput.oninput = function () { state.movieMinutes = movieMinutesInput.value; refreshComputedOnly(); };

    var episodesInput = document.getElementById("episodesInput");
    if (episodesInput) episodesInput.oninput = function () { state.episodes = episodesInput.value; refreshComputedOnly(); };
    var episodeMinutesInput = document.getElementById("episodeMinutesInput");
    if (episodeMinutesInput) episodeMinutesInput.oninput = function () { state.episodeMinutes = episodeMinutesInput.value; refreshComputedOnly(); };

    var seriesHoursInput = document.getElementById("seriesHoursInput");
    if (seriesHoursInput) seriesHoursInput.oninput = function () { state.seriesTotalHours = seriesHoursInput.value; refreshComputedOnly(); };
    var seriesMinutesInput = document.getElementById("seriesMinutesInput");
    if (seriesMinutesInput) seriesMinutesInput.oninput = function () { state.seriesTotalMinutes = seriesMinutesInput.value; refreshComputedOnly(); };

    var dateInput = document.getElementById("dateInput");
    if (dateInput) dateInput.onchange = function () { state.date = dateInput.value; };

    var addBtn = document.getElementById("addBtn");
    if (addBtn) addBtn.onclick = handleAdd;

    root.querySelectorAll("[data-delete]").forEach(function (btn) {
      btn.onclick = function () { handleDelete(btn.getAttribute("data-delete")); };
    });

    // Debounced full re-render on numeric inputs so the computed total updates live
    // without losing focus: we re-render only the computed box + button state via light touch.
    function refreshComputedOnly() {
      var total = computedTotal();
      // Full render is simplest and safe here; inputs keep value from state on next render.
      // To avoid focus loss, we just update text nodes directly instead of full render.
      var addBtnEl = document.getElementById("addBtn");
      var existingBox = root.querySelector(".computed-box .mono");
      if (existingBox) existingBox.textContent = formatDuration(total);
    }
  }

  render();
})();
</script>
</body>
</html>
